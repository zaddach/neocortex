# https://gist.githubusercontent.com/usrbinkat/de44facc683f954bf0cca6c87e2f9f88/raw/0402e8441de57ccd8b00fe0db8ad40cae7d5fdb8/docker-compose.yaml
# Settings shared by the cognee API server and cognee-mcp, which operate on
# the same storage volumes.
x-cognee-env: &cognee-env
  ENV: local
  SYSTEM_ROOT_DIRECTORY: /cognee-storage/system
  DATA_ROOT_DIRECTORY: /cognee-storage/data
  DEFAULT_USER_PASSWORD: ${COGNEE_DEFAULT_USER_PASSWORD:-default_password}
  LLM_PROVIDER: ollama
  LLM_MODEL: qwen3.5:9b
  LLM_ENDPOINT: http://ollama:11434
  LLM_API_KEY: ollama
  # qwen3.5 is a reasoning model; without this every call spends hundreds of
  # tokens thinking first (the API equivalent of `ollama run --think=false`).
  LLM_ARGS: '{"think": false}'
  EMBEDDING_PROVIDER: ollama
  EMBEDDING_MODEL: nomic-embed-text:latest
  EMBEDDING_ENDPOINT: http://ollama:11434/api/embed
  EMBEDDING_DIMENSIONS: "768"

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=debug
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    volumes:
      - ollama:/root/.ollama
    # No host port: the host may run its own Ollama on 11434. Reach this one
    # through the reverse proxy at http://ollama.localhost:8080.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - ollama-net
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-Lf", "http://localhost:11434/"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 30

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: ollama-model-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama pull qwen3.5:9b; do echo "waiting for ollama..."; sleep 2; done
        until ollama pull nomic-embed-text; do echo "waiting for ollama..."; sleep 2; done
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - ollama-net
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

  angr-mcp:
    build: ./angr-mcp
    container_name: angr-mcp
    networks:
      - ollama-net
    restart: unless-stopped
    volumes:
      - malware:/malware:ro

  ghidra-headless-mcp:
    build: ./ghidra-headless-mcp
    container_name: ghidra-headless-mcp
    networks:
      - ollama-net
    restart: unless-stopped
    volumes:
      - malware:/malware:ro

  # Cognee REST API (also serves /health and /docs). Owns the database
  # migrations; cognee-mcp shares its storage volumes.
  cognee:
    image: cognee/cognee:main
    container_name: cognee
    environment:
      <<: *cognee-env
      # The browser reaches the API same-origin through the reverse proxy.
      CORS_ALLOWED_ORIGINS: "http://cognee.localhost:${NEOCORTEX_PORT:-8080}"
    volumes:
      - cognee_system:/cognee-storage/system
      - cognee_data:/cognee-storage/data
    networks:
      - ollama-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

  cognee-mcp:
    image: cognee/cognee-mcp:main
    container_name: cognee-mcp
    command: --no-migration
    environment:
      <<: *cognee-env
      TRANSPORT_MODE: http
      HTTP_PORT: "8000"
    volumes:
      - cognee_system:/cognee-storage/system
      - cognee_data:/cognee-storage/data
    networks:
      - ollama-net
    restart: unless-stopped
    depends_on:
      cognee:
        condition: service_healthy

  cognee-ui:
    image: cognee/cognee-ui:latest
    container_name: cognee-ui
    environment:
      # Used by the browser *and* by the UI's server-side routes, so it must
      # resolve in both places: the reverse proxy carries a network alias for
      # cognee.localhost, and browsers resolve *.localhost to loopback.
      COGNEE_BACKEND_URL: "http://cognee.localhost:${NEOCORTEX_PORT:-8080}"
      DEFAULT_USER_PASSWORD: ${COGNEE_DEFAULT_USER_PASSWORD:-default_password}
    networks:
      - ollama-net
    restart: unless-stopped
    depends_on:
      cognee:
        condition: service_healthy

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://ollama:11434/v1
      HINDSIGHT_API_LLM_MODEL: qwen3.5:9b
      # Grammar-enforce JSON output; Ollama otherwise gets the schema in the
      # prompt only, and small/thinking models can return unparseable JSON.
      HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
      # Structured calls already send think=false to Ollama's native API; this
      # covers the free-form calls (e.g. reflect), which use /v1 and only
      # honour reasoning_effort.
      HINDSIGHT_API_LLM_REASONING_EFFORT: none
      # Control plane (port 9999) talks to the API (port 8888) in-container.
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    networks:
      - ollama-net
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

  mcp-gateway:
    image: nginx:alpine
    container_name: mcp-gateway
    volumes:
      - ./nginx/mcp-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/mcp-proxy.inc:/etc/nginx/mcp-proxy.inc:ro
    networks:
      - ollama-net
    restart: unless-stopped
    # No host port: reached through the reverse proxy at /mcp/.
    depends_on:
      - angr-mcp
      - ghidra-headless-mcp
      - cognee-mcp
      - hindsight

  # Single entry point for every web UI and REST API, using name-based virtual
  # hosts on *.localhost (browsers resolve these to loopback without any
  # /etc/hosts entries). nginx listens on the same port inside and outside the
  # container so that URLs like http://cognee.localhost:8080 work both from
  # the host and from other containers (via the network aliases below).
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    environment:
      - NEOCORTEX_PORT=${NEOCORTEX_PORT:-8080}
    volumes:
      - ./nginx/reverse-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy-common.inc:/etc/nginx/proxy-common.inc:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      ollama-net:
        aliases:
          - cognee.localhost
          - cognee-api.localhost
          - hindsight.localhost
          - hindsight-api.localhost
          - ollama.localhost
          - files.localhost
    restart: unless-stopped
    ports:
      - "${NEOCORTEX_PORT:-8080}:${NEOCORTEX_PORT:-8080}"

volumes:
  ollama:
  malware:
  cognee_system:
  cognee_data:
  hindsight_data:
networks:
  ollama-net:
    driver: bridge
