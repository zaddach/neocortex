# Upload endpoint for the shared `malware` volume: the only container that
# mounts it read-write (the analysis servers mount it read-only).
#   PUT    /<path>   store a file (parent directories are created)
#   DELETE /<path>   remove a file
#   GET    /         list files
server {
    listen 80;
    server_name sample-drop;

    root /data;
    client_max_body_size 0;
    client_body_temp_path /tmp/client_body;

    autoindex on;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access user:rw group:r all:r;
}
