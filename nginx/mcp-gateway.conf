# Docker's embedded DNS. Upstreams are referenced through variables so nginx
# resolves them per request and starts even when some MCP servers are down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name mcp-gateway;

    location ~ ^/angr/?$ {
        set $upstream angr-mcp:80;
        rewrite ^ /mcp break;
        proxy_pass http://$upstream;
        include /etc/nginx/mcp-proxy.inc;
    }

    location ~ ^/ghidra/?$ {
        set $upstream ghidra-headless-mcp:80;
        rewrite ^ /mcp break;
        proxy_pass http://$upstream;
        include /etc/nginx/mcp-proxy.inc;
    }

    location ~ ^/cognee/?$ {
        set $upstream cognee-mcp:8000;
        rewrite ^ /mcp break;
        proxy_pass http://$upstream;
        include /etc/nginx/mcp-proxy.inc;
    }

    # Hindsight serves one MCP endpoint per memory bank at /mcp/<bank>/, so
    # /hindsight/<bank>/ maps onto it (e.g. /hindsight/neocortex/).
    location /hindsight/ {
        set $upstream hindsight:8888;
        rewrite ^/hindsight/(.*)$ /mcp/$1 break;
        proxy_pass http://$upstream;
        include /etc/nginx/mcp-proxy.inc;
    }
}
