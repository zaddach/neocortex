<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neocortex</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; }
  code { font-size: .9em; }
</style>
</head>
<body>
<h1>neocortex</h1>
<table>
  <tr><th>Service</th><th>Web UI</th><th>API</th></tr>
  <tr><td>File browser (malware volume)</td><td><a data-host="" href="/filebrowser/">/filebrowser/</a></td><td></td></tr>
  <tr><td>Cognee</td><td><a data-host="cognee" href="/">cognee</a></td><td><a data-host="cognee-api" href="/docs">cognee-api</a></td></tr>
  <tr><td>Hindsight</td><td><a data-host="hindsight" href="/">hindsight</a></td><td><a data-host="hindsight-api" href="/docs">hindsight-api</a></td></tr>
  <tr><td>Neo4j (cognee graph)</td><td><a data-host="neo4j" href="/">neo4j</a></td><td></td></tr>
  <tr><td>Ollama</td><td></td><td><a data-host="ollama" href="/api/tags">ollama</a></td></tr>
  <tr><td>MCP servers</td><td></td><td><code>/mcp/{angr,ghidra,cognee,hindsight/&lt;bank&gt;}/</code></td></tr>
</table>
<script>
  // Point each link at <name>.localhost on whatever port this page was served from.
  for (const a of document.querySelectorAll("a[data-host]")) {
    if (!a.dataset.host) continue;
    const url = new URL(a.getAttribute("href"), location.href);
    url.hostname = a.dataset.host + ".localhost";
    a.href = url;
    a.textContent = url.origin + (url.pathname === "/" ? "" : url.pathname);
  }
</script>
</body>
</html>
